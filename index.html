<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherGPT - AI Weather Assistant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container d-flex flex-column justify-content-center align-items-center vh-100"
    >
      <div
        class="text-center mb-3 d-flex align-items-center justify-content-between w-100 px-4"
        style="max-width: 500px"
      >
        <div>
          <h2 class="text-white fw-bold m-0">
            <i class="fa-solid fa-cloud-sun text-warning"></i> Weather<span
              class="text-info"
              >GPT</span
            >
          </h2>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button
            onclick="detectLocation()"
            class="btn btn-sm btn-outline-info text-white border-secondary shadow-none d-flex align-items-center gap-1"
            title="Detect Current Location / Village"
          >
            <i class="fa-solid fa-location-crosshairs"></i>
            <span class="d-none d-sm-inline">GPS</span>
          </button>

          <select
            id="langSelect"
            class="form-select form-select-sm bg-transparent text-white border-secondary shadow-none"
          >
            <option value="en" class="bg-dark">English</option>
            <option value="hi" class="bg-dark">हिंदी (Hindi)</option>
            <option value="bn" class="bg-dark">বাংলা (Bengali)</option>
            <option value="ta" class="bg-dark">தமிழ் (Tamil)</option>
            <option value="te" class="bg-dark">తెలుగు (Telugu)</option>
            <option value="kn" class="bg-dark">ಕನ್ನಡ (Kannada)</option>
            <option value="ml" class="bg-dark">മലയാളം (Malayalam)</option>
            <option value="mr" class="bg-dark">मराठी (Marathi)</option>
            <option value="gu" class="bg-dark">ગુજરાતી (Gujarati)</option>
            <option value="pa" class="bg-dark">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="or" class="bg-dark">ଓଡ଼ିଆ (Odia)</option>
          </select>
        </div>
      </div>

      <div class="chat-container shadow-lg d-flex flex-column">
        <div id="chatWindow" class="chat-window flex-grow-1 p-3 overflow-auto">
          <div id="welcomeMsg" class="message bot-msg">
            Hello! 👋 Ask me for the weather or forecast of any city.
          </div>
        </div>

        <div class="preset-chips px-3 py-2 d-flex gap-2 overflow-auto">
          <button class="chip-btn" onclick="sendPreset('Delhi')">Delhi</button>
          <button class="chip-btn" onclick="sendPreset('Mumbai')">
            Mumbai
          </button>
          <button class="chip-btn" onclick="sendPreset('Bangalore')">
            Bangalore
          </button>
          <button class="chip-btn" onclick="sendPreset('Chennai')">
            Chennai
          </button>
          <button class="chip-btn" onclick="sendPreset('Kolkata')">
            Kolkata
          </button>
          <button class="chip-btn" onclick="sendPreset('Muzaffarpur')">
            Muzaffarpur
          </button>
        </div>

        <div
          class="input-area p-3 d-flex align-items-center gap-2 border-top border-secondary border-opacity-25"
        >
          <button class="mic-btn" onclick="startVoiceInput()">
            <i id="micIcon" class="fa-solid fa-microphone text-danger"></i>
          </button>
          <input
            type="text"
            id="userInput"
            class="form-control bg-transparent text-white border-0 shadow-none"
            placeholder="Type a city or village..."
            onkeypress="checkEnter(event)"
          />
          <button class="send-btn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
