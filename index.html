<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherGPT - AI Weather Assistant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container d-flex flex-column justify-content-center align-items-center vh-100"
    >
      <div class="text-center mb-3">
        <h2 class="text-white fw-bold">
          <i class="fa-solid fa-cloud-sun text-warning"></i> Weather<span
            class="text-info"
            >GPT</span
          >
        </h2>
        <p class="text-light m-0 small opacity-75">
          Your intelligent conversational meteorology companion
        </p>
      </div>

      <div class="chat-container shadow-lg d-flex flex-column">
        <div id="chatWindow" class="chat-window flex-grow-1 p-3 overflow-auto">
          <div class="message bot-msg">
            Hello! 👋 Main WeatherGPT hoon. Aap kisi bhi shehar ka weather ya
            5-din ka forecast puch sakte hain.
          </div>
        </div>

        <div class="preset-chips px-3 py-2 d-flex gap-2 overflow-auto">
          <button class="chip-btn" onclick="sendPreset('Delhi')">Delhi</button>
          <button class="chip-btn" onclick="sendPreset('Mumbai')">
            Mumbai
          </button>
          <button class="chip-btn" onclick="sendPreset('London')">
            London
          </button>
          <button class="chip-btn" onclick="sendPreset('New York')">
            New York
          </button>
          <button class="chip-btn" onclick="sendPreset('Tokyo')">Tokyo</button>
        </div>

        <div
          class="input-area p-3 d-flex align-items-center gap-2 border-top border-secondary border-opacity-25"
        >
          <button class="mic-btn" onclick="startVoiceInput()">
            <i id="micIcon" class="fa-solid fa-microphone text-danger"></i>
          </button>
          <input
            type="text"
            id="userInput"
            class="form-control bg-transparent text-white border-0 shadow-none"
            placeholder="Type a city or ask forecast..."
            onkeypress="checkEnter(event)"
          />
          <button class="send-btn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
