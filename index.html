<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherGPT - Conversational Weather Assistant</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary px-4 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"
          ><i class="bi bi-cloud-sun-fill me-2"></i> WeatherGPT</a
        >
        <span class="text-white small">SIH 2026 Prototype</span>
      </div>
    </nav>

    <!-- Main Container -->
    <div
      class="container my-4 flex-grow-1 d-flex flex-column"
      style="max-width: 800px"
    >
      <!-- Chat Box Window -->
      <div id="chatWindow" class="chat-container mb-3 d-flex flex-column">
        <div class="message bot-msg">
          Hello! Main WeatherGPT hoon. Aap kisi bhi shehar ka mausam check karne
          ke liye niche diye buttons par click kar sakte hain ya type kar sakte
          hain.
        </div>
      </div>

      <!-- Quick Suggestion Buttons -->
      <div class="mb-2 d-flex gap-2 flex-wrap">
        <button
          class="btn btn-sm btn-outline-secondary rounded-pill"
          onclick="sendPreset('Delhi')"
        >
          📍 Delhi
        </button>
        <button
          class="btn btn-sm btn-outline-secondary rounded-pill"
          onclick="sendPreset('Mumbai')"
        >
          📍 Mumbai
        </button>
        <button
          class="btn btn-sm btn-outline-secondary rounded-pill"
          onclick="sendPreset('Muzaffarpur')"
        >
          📍 Muzaffarpur
        </button>
        <button
          class="btn btn-sm btn-outline-secondary rounded-pill"
          onclick="sendPreset('Patna')"
        >
          📍 Patna
        </button>
      </div>

      <!-- Input Form -->
      <div class="input-group shadow-sm">
        <input type="text" id="userInput" class="form-control form-control-lg" placeholder="Type city name or click mic..." onkeypress="checkEnter(event)">
        <button class="btn btn-outline-secondary px-3" onclick="startVoiceInput()" title="Speak city"><i class="bi bi-mic-fill text-danger" id="micIcon"></i></button>
        <button class="btn btn-primary px-4 fw-semibold" onclick="sendMessage()"><i class="bi bi-send-fill"></i> Send</button>
      </div>

    <!-- Custom JS File -->
    <script src="script.js"></script>
  </body>
</html>
